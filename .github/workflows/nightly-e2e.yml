name: Nightly E2E

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v6
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          AUTH_SECRET: nightly-e2e-secret
          E2E_GITHUB_PAT: ${{ secrets.E2E_GITHUB_PAT }}
          AUTH_URL: http://localhost:3000
