name: Lighthouse

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v6
      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: lighthouse-build-secret
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./.lighthouserc.json"
